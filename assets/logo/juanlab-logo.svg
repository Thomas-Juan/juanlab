<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none" role="img" aria-label="Juan Lab logo">
  <title>Juan Lab</title>
  <g stroke="#1f1b33" stroke-linecap="round">
    <!-- Main trunk: ascending vessel -->
    <path d="M50 92 C50 72, 50 60, 50 38" stroke-width="5"/>
    <!-- Left primary branch -->
    <path d="M50 58 C42 50, 30 42, 18 36" stroke-width="4"/>
    <!-- Left secondary branches -->
    <path d="M30 44 C26 36, 20 28, 14 20" stroke-width="2.5"/>
    <path d="M24 40 C18 38, 12 40, 8 44" stroke-width="2"/>
    <!-- Right primary branch -->
    <path d="M50 50 C58 42, 68 34, 80 28" stroke-width="4"/>
    <!-- Right secondary branches -->
    <path d="M68 36 C74 28, 78 20, 82 12" stroke-width="2.5"/>
    <path d="M74 32 C80 30, 86 32, 92 36" stroke-width="2"/>
    <!-- Top branches from trunk -->
    <path d="M50 38 C48 28, 44 18, 38 10" stroke-width="3"/>
    <path d="M50 38 C54 26, 58 18, 64 12" stroke-width="2.5"/>
  </g>
  <!-- Flow dot accents -->
  <g fill="#e0613f">
    <circle cx="18" cy="36" r="3"/>
    <circle cx="80" cy="28" r="3"/>
    <circle cx="50" cy="92" r="4"/>
  </g>
</svg>
